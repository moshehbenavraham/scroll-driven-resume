services:
  # ==========================================================================
  # MinIO - S3-compatible object storage for frame sequences
  # ==========================================================================
  minio:
    image: minio/minio:latest
    container_name: resume-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - resume-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # PostgreSQL - Metadata storage for assets
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: resume-postgres
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resume_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_secret_123}
      POSTGRES_DB: ${POSTGRES_DB:-resume_metadata}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - resume-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume_admin} -d ${POSTGRES_DB:-resume_metadata}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # Nginx - Reverse proxy with caching for CDN-like performance
  # ==========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: resume-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - resume-network
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

# ==========================================================================
# Networks
# ==========================================================================
networks:
  resume-network:
    driver: bridge
    name: resume-network

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  minio_data:
    name: resume-minio-data
  postgres_data:
    name: resume-postgres-data
  nginx_cache:
    name: resume-nginx-cache
